<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Driver Login</title>

    <style>

        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

            font-family:
                'Segoe UI',
                Arial,
                sans-serif;
        }

        body {

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #1e3c72,
                    #2a5298
                );
        }

        .container {

            background: white;

            padding: 40px 50px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.2);

            width: 350px;

            text-align: center;
        }

        h1 {

            color: #1e3c72;

            margin-bottom: 25px;

            font-size: 24px;
        }

        input {

            width: 100%;

            padding: 12px;

            margin-bottom: 15px;

            border:
                1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        button {

            width: 100%;

            padding: 13px;

            background-color: #2a9d8f;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;
        }

        button:disabled {

            background-color: #aaa;

            cursor: not-allowed;
        }

        #errorMsg {

            color: #e63946;

            margin-top: 12px;

            font-size: 14px;

            min-height: 18px;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>
            🚌 Driver Login
        </h1>
        


        <input
            type="text"
            id="username"
            placeholder="Username"

        >



        <input
            type="password"
            id="password"
            placeholder="Password"
        >


        <button
            id="loginBtn"
            onclick="login()">

            Login

        </button>



        <p id="errorMsg"></p>

        <footer>all rights reserves</footer>

    </div>


    <script>

        // Enter key support

        document
            .getElementById("username")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {

                    document
                        .getElementById("password")
                        .focus();

                }

            });


        document
            .getElementById("password")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {

                    login();

                }

            });


        async function login() {

            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const errorMsg =
                document
                    .getElementById("errorMsg");


            const loginBtn =
                document
                    .getElementById("loginBtn");


            errorMsg.innerText = "";


            if (!username || !password) {

                errorMsg.innerText =
                    "Please enter both fields";

                return;

            }


            loginBtn.disabled = true;

            loginBtn.innerText =
                "Logging in...";


            try {

                const response =
                    await fetch(
                        "/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    username,
                                    password
                                })
                        }
                    );


                const result =
                    await response.json();


                if (result.success) {

                    // Token save
                    sessionStorage.setItem(
                        "authToken",
                        result.token
                    );


                    // Bus number save
                    sessionStorage.setItem(
                        "busNumber",
                        result.busNumber
                    );


                    window.location.href =
                        "/driver.html";

                } else {

                    errorMsg.innerText =
                        result.message;

                }

            } catch (error) {

                console.error(error);

                errorMsg.innerText =
                    "Server connection failed";

            }


            loginBtn.disabled = false;

            loginBtn.innerText =
                "Login";

        }

    </script>

</body>

</html>
