<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Driver Panel</title>

    <style>

        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

            font-family:
                'Segoe UI',
                Arial,
                sans-serif;
        }

        html,
        body {

            height: 100%;
            width: 100%;
        }

        body {

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #1e3c72,
                    #2a5298
                );
        }

        .container {

            background: white;

            padding: 40px 50px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.2);

            text-align: center;

            width: 380px;
        }

        h1 {

            font-size: 26px;

            color: #1e3c72;

            margin-bottom: 25px;
        }

        label {

            display: block;

            text-align: left;

            font-size: 14px;

            color: #555;

            margin-bottom: 6px;
        }

        #busNumber {

            width: 100%;

            padding: 12px;

            font-size: 15px;

            border:
                1px solid #ccc;

            border-radius: 8px;

            margin-bottom: 18px;

            outline: none;

            background: #eee;

            color: #333;

            cursor: not-allowed;
        }

        button {

            width: 100%;

            padding: 14px;

            font-size: 16px;

            font-weight: 600;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            color: white;

            margin-bottom: 10px;
        }

        #startBtn {

            background-color: #e76f51;
        }

        #stopBtn {

            background-color: #6c757d;
        }

        #logoutBtn {

            background-color: #dc3545;

            margin-top: 5px;
        }

        button:disabled {

            background-color: #cccccc;

            cursor: not-allowed;
        }

        #status {

            margin-top: 20px;

            font-size: 14px;

            color: #333;

            background: #f4f4f4;

            padding: 10px;

            border-radius: 8px;

            word-wrap: break-word;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>
            🚌 Driver Panel
        </h1>


        <label>
            Your Assigned Bus:
        </label>


        <input
            type="text"
            id="busNumber"
            readonly
        >


        <button
            id="startBtn"
            onclick="startSharing()">

            Start Sharing Location

        </button>


        <button
            id="stopBtn"
            onclick="stopSharing()"
            disabled>

            Stop Sharing Location

        </button>


        <button
            id="logoutBtn"
            onclick="logout()">

            Logout

        </button>


        <p id="status">

            Status: Not started yet

        </p>

    </div>


    <script src="/socket.io/socket.io.js"></script>


    <script>

        const token =
            sessionStorage.getItem("authToken");


        let watchId = null;


        let socket = null;


        // =========================
        // LOGIN CHECK
        // =========================

        async function checkLogin() {

            if (!token) {

                window.location.href =
                    "/login.html";

                return;

            }


            try {

                const response =
                    await fetch(
                        "/verify",
                        {
                            headers: {
                                "Authorization":
                                    "Bearer " + token
                            }
                        }
                    );


                if (!response.ok) {

                    sessionStorage.clear();

                    window.location.href =
                        "/login.html";

                    return;

                }


                const result =
                    await response.json();


                if (!result.success) {

                    sessionStorage.clear();

                    window.location.href =
                        "/login.html";

                    return;

                }


                // Server se assigned bus
                document
                    .getElementById("busNumber")
                    .value =
                    result.busNumber;


                // Socket connection
                connectSocket();

            } catch (error) {

                console.error(error);

                sessionStorage.clear();

                window.location.href =
                    "/login.html";

            }

        }


        // =========================
        // SOCKET CONNECTION
        // =========================

        function connectSocket() {

            socket = io({

                auth: {
                    token: token
                }

            });


            socket.on("connect", () => {

                console.log(
                    "Driver socket connected"
                );

            });


            socket.on("connect_error", () => {

                document
                    .getElementById("status")
                    .innerText =
                    "Connection error";

            });

        }


        // =========================
        // START LOCATION
        // =========================

        function startSharing() {

            if (!socket || !socket.connected) {

                alert(
                    "Server connection is not ready. Please wait and try again."
                );

                return;

            }

            if (watchId !== null) {
                return;
            }


            if (!navigator.geolocation) {

                alert(
                    "This browser does not support GPS"
                );

                return;

            }


            try {
                watchId =
                    navigator.geolocation.watchPosition(

                    (position) => {

                        const lat =
                            position.coords.latitude;

                        const lng =
                            position.coords.longitude;


                        // Bus number manually nahi bhej rahe
                        // Server khud assigned bus use karega

                        socket.emit(
                            "send-location",
                            {
                                lat: lat,
                                lng: lng
                            }
                        );


                        document
                            .getElementById("status")
                            .innerText =
                            "Status: Sharing location — Lat: " +
                            lat +
                            ", Lng: " +
                            lng;

                    },


                    (error) => {

                        console.error(error);

                        // Stop the failed watch and allow the driver to retry.
                        if (watchId !== null) {
                            navigator.geolocation.clearWatch(watchId);
                            watchId = null;
                        }

                        document
                            .getElementById("status")
                            .innerText =
                            error.code === 1
                                ? "Location permission denied. Allow location access in browser settings, then try again."
                                : error.code === 2
                                    ? "Location unavailable. Check GPS/location services and try again."
                                    : "Location request timed out. Please try again.";

                        document
                            .getElementById("startBtn")
                            .disabled = false;

                        document
                            .getElementById("stopBtn")
                            .disabled = true;

                    },


                    {

                        enableHighAccuracy: true,

                        maximumAge: 0,

                        timeout: 5000

                    }

                    );

            } catch (error) {
                console.error(error);
                watchId = null;
                document.getElementById("status").innerText =
                    "Could not start GPS. Check browser location permissions.";
                return;
            }

            document
                .getElementById("startBtn")
                .disabled = true;


            document
                .getElementById("stopBtn")
                .disabled = false;

        }


        // =========================
        // STOP LOCATION
        // =========================

        function stopSharing() {

            if (watchId !== null) {

                navigator.geolocation.clearWatch(
                    watchId
                );

                watchId = null;

            }


            if (socket) {

                socket.emit(
                    "stop-sharing"
                );

            }


            document
                .getElementById("status")
                .innerText =
                "Status: Sharing stopped";


            document
                .getElementById("startBtn")
                .disabled = false;


            document
                .getElementById("stopBtn")
                .disabled = true;

        }


        // =========================
        // LOGOUT
        // =========================

        function logout() {

            if (watchId !== null) {

                navigator.geolocation.clearWatch(
                    watchId
                );
                watchId = null;

            }


            if (socket) {

                socket.emit(
                    "stop-sharing"
                );

                socket.disconnect();

            }


            sessionStorage.clear();


            window.location.href =
                "/login.html";

        }


        // Start
        checkLogin();

    </script>

</body>

</html>
